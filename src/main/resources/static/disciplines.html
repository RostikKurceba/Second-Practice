<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Навчальні дисципліни</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/disciplines.css">

</head>

<body>

<header class="admin-header">

    <header class="main-header">

        <div class="header-content">

            <h1>Student Management System</h1>

            <div class="user-info">

                <span id="userEmail"></span>

                <span class="role-badge">
                Адміністратор
            </span>

                <button id="logoutButton">
                    Вийти
                </button>

            </div>

        </div>

    </header>

</header>

<main class="disciplines-container">

    <div class="page-header">

        <div>
            <h1>Навчальні дисципліни</h1>

            <p>
                Керування навчальними дисциплінами
            </p>
        </div>

        <button
                class="create-button"
                id="createDisciplineButton"
        >
            + Створити дисципліну
        </button>

    </div>

    <div id="disciplinesList">

        <div class="empty-state">
            Завантаження...
        </div>

    </div>

</main>

<div
        class="modal-overlay"
        id="modalOverlay"
        style="display: none;"
>

    <div class="modal">

        <h2 id="modalTitle">
            Створення дисципліни
        </h2>

        <form id="disciplineForm">

            <div class="form-group">

                <label for="name">
                    Назва дисципліни
                </label>

                <input
                        type="text"
                        id="name"
                        required
                        maxlength="150"
                        placeholder="Наприклад: Об'єктно-орієнтоване програмування"
                >

            </div>

            <div class="form-group">

                <label for="code">
                    Код дисципліни
                </label>

                <input
                        type="text"
                        id="code"
                        required
                        maxlength="50"
                        placeholder="Наприклад: ООП"
                >

            </div>

            <div class="form-group">

                <label for="description">
                    Опис
                </label>

                <textarea
                        id="description"
                        maxlength="1000"
                        placeholder="Короткий опис дисципліни"
                ></textarea>

            </div>

            <div class="form-group">

                <label for="hours">
                    Кількість годин
                </label>

                <input
                        type="number"
                        id="hours"
                        min="1"
                        required
                        placeholder="Наприклад: 120"
                >

            </div>

            <p id="formMessage"></p>

            <div class="modal-actions">

                <button
                        type="submit"
                        class="save-button"
                >
                    Зберегти
                </button>

                <button
                        type="button"
                        class="cancel-button"
                        id="cancelButton"
                >
                    Скасувати
                </button>

            </div>

        </form>

    </div>

</div>

<script src="/js/disciplines.js"></script>

</body>

</html>
