<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Кабінет студента</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/student.css">
</head>

<body>

<div class="student-page">

    <header class="main-header">

        <div class="header-content">

            <h1>Student Management System</h1>

            <div class="user-info">

                <span id="studentEmail">
                    Завантаження...
                </span>

                <span class="role-badge">
                    Студент
                </span>

                <button id="logoutButton">
                    Вийти
                </button>

            </div>

        </div>

    </header>


    <main class="student-content">

        <!-- Особисті дані -->
        <section class="student-section">

            <h2>Особисті дані</h2>

            <div class="info-grid">

                <div class="info-item">
                    <span class="info-label">Ім'я</span>
                    <span id="studentFirstName">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Прізвище</span>
                    <span id="studentLastName">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">По батькові</span>
                    <span id="studentPatronymic">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Телефон</span>
                    <span id="studentPhone">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Факультет</span>
                    <span id="studentFaculty">-</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Курс</span>
                    <span id="studentCourse">-</span>
                </div>

            </div>

        </section>


        <!-- Група -->
        <section class="student-section">

            <h2>Моя група</h2>

            <div id="groupInfo">

                <div class="no-group">
                    Групу ще не призначено
                </div>

            </div>

        </section>


        <!-- Дисципліни -->
        <section class="student-section">

            <h2>Мої дисципліни</h2>

            <div id="disciplinesList">

                <div class="loading">
                    Завантаження...
                </div>

            </div>

        </section>

    </main>

</div>

<script src="/js/student.js"></script>

</body>
</html>
