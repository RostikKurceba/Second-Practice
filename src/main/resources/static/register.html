<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Реєстрація</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/register.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Реєстрація</h1>

        <p class="subtitle">
            Створіть новий обліковий запис
        </p>

        <form id="registerForm">

            <div class="form-group">

                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        placeholder="Введіть email"
                        required
                >

            </div>

            <div class="form-group">

                <label for="password">Пароль</label>

                <input
                        type="password"
                        id="password"
                        placeholder="Мінімум 6 символів"
                        minlength="6"
                        required
                >

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Підтвердження пароля
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Повторіть пароль"
                        minlength="6"
                        required
                >

            </div>

            <div class="form-group">

                <label>Роль</label>

                <div class="role-selection">

                    <label>
                        <input
                                type="radio"
                                name="role"
                                value="STUDENT"
                                checked
                        >
                        Студент
                    </label>

                    <label>
                        <input
                                type="radio"
                                name="role"
                                value="ADMIN"
                        >
                        Адміністратор
                    </label>

                    <div id="studentFields" style="display: none;">

                        <div class="form-group">

                            <label for="firstName">
                                Ім'я
                            </label>

                            <input
                                    type="text"
                                    id="firstName"
                                    placeholder="Введіть ім'я"
                            >

                        </div>


                        <div class="form-group">

                            <label for="lastName">
                                Прізвище
                            </label>

                            <input
                                    type="text"
                                    id="lastName"
                                    placeholder="Введіть прізвище"
                            >

                        </div>


                        <div class="form-group">

                            <label for="patronymic">
                                По батькові
                            </label>

                            <input
                                    type="text"
                                    id="patronymic"
                                    placeholder="Введіть по батькові"
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Телефон
                            </label>

                            <input
                                    type="tel"
                                    id="phone"
                                    placeholder="+380..."
                            >

                        </div>


                        <div class="form-group">

                            <label for="faculty">
                                Факультет
                            </label>

                            <input
                                    type="text"
                                    id="faculty"
                                    placeholder="Наприклад: Факультет інформаційних технологій"
                            >

                        </div>


                        <div class="form-group">

                            <label for="course">
                                Курс
                            </label>

                            <select id="course">

                                <option value="">
                                    Оберіть курс
                                </option>

                                <option value="1">1 курс</option>
                                <option value="2">2 курс</option>
                                <option value="3">3 курс</option>
                                <option value="4">4 курс</option>
                                <option value="5">5 курс</option>
                                <option value="6">6 курс</option>

                            </select>

                        </div>

                    </div>

                </div>

            </div>

            <button type="submit">
                Зареєструватися
            </button>

        </form>

        <p id="message"></p>

        <p class="switch-auth">
            Вже маєте обліковий запис?
            <a href="/login.html">Увійти</a>
        </p>

    </div>

</div>

<script src="/js/register.js"></script>

</body>
</html>
